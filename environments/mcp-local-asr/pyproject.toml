[project]
name = "mcp-local-asr"
version = "0.1.0"
description = "Qwen3-ASR and speaker diarization runtime for mcp-tools"
requires-python = "==3.12.*"
dependencies = [
    "annotated-doc==0.0.4",
    "click==8.4.2",
    "fastapi==0.136.1",
    "ffmpeg-python==0.2.0",
    "huggingface-hub==0.36.2",
    "mcp==1.27.0",
    "numpy==2.4.4",
    "pyannote-audio==4.0.4",
    "pydantic==2.13.3",
    # mcp 1.x leaves FastMCP.Settings.lifespan unresolved; 2.15.0 warns on every startup.
    "pydantic-settings==2.14.2",
    "python-multipart==0.0.27",
    "qwen-asr==0.0.6",
    "soundfile==0.13.1",
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "torchcodec==0.11.1",
    "transformers==4.57.6",
    "uvicorn[standard]==0.46.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "ruff==0.15.12",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
