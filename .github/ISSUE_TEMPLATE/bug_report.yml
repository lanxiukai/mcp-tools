name: Bug report
description: Report a reproducible problem in an mcp-tools server, installer, or document.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Remove credentials, cookies, private URLs, and personal data from every field and log excerpt.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Format Conversion
        - Browser Fetch
        - ASR
        - ASR Pipeline
        - OCR
        - Vision Local
        - Brave Websearch launcher
        - Installer or runtime environment
        - Documentation or example
        - Other
    validations:
      required: true

  - type: dropdown
    id: profile
    attributes:
      label: Installation profile
      options:
        - mcp-local (CPU)
        - mcp-local-asr
        - mcp-local-ocr
        - Brave Websearch only
        - Not sure or not applicable
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS/WSL version, uv version, Python version, MCP client, and GPU/driver details when relevant.
      placeholder: |
        OS: Ubuntu 24.04 on WSL2
        uv: 0.x
        Python: 3.12.x
        MCP client: name and version
        GPU/driver: if relevant
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest sequence that reproduces the problem, using placeholders for private paths or inputs.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or test output
      description: Paste only the shortest useful excerpt after redacting secrets, private paths, URLs, and personal data.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I reproduced this with the repository's locked uv profile when applicable.
          required: true
        - label: I removed credentials, cookies, private URLs, and personal data.
          required: true
